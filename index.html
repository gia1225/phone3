<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phone · 故事模拟器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="phone" data-status="light">

  <!-- 状态栏 -->
  <div class="status">
    <span id="statTime">9:41</span>
    <span class="stat-right">
      <span class="sig"><i></i><i></i><i></i><i></i></span>
      <span class="wifi">◗</span>
      <span class="bat"><b></b></span>
    </span>
  </div>

  <!-- ========== 锁屏 ========== -->
  <section id="scr-lock" class="screen active">
    <div class="lock-bg"></div>
    <div class="lock-top">
      <div class="lock-time" id="lockTime">9:41</div>
      <div class="lock-date" id="lockDate">1月1日 星期一</div>
    </div>
    <div class="lock-bottom">
      <div class="lock-title">输入密码</div>
      <div class="dots" id="dots">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="lock-msg" id="lockMsg"></div>
      <div class="keypad" id="keypad"></div>
      <div class="lock-hint">默认密码 1234</div>
    </div>
  </section>

  <!-- ========== 主页 ========== -->
  <section id="scr-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-page">
      <div class="app-grid" id="appGrid"></div>
    </div>
    <div class="dock" id="dock"></div>
  </section>

  <!-- ========== 应用容器 ========== -->
  <section id="scr-app" class="screen">
    <header class="app-bar">
      <button class="nav-back" id="btnBack">‹</button>
      <h1 id="appTitle">应用</h1>
      <div class="app-actions" id="appActions"></div>
    </header>
    <div class="app-body" id="appBody"></div>
  </section>

  <!-- ========== 来电 ========== -->
  <section id="scr-call" class="screen call-screen">
    <div class="call-bg"></div>
    <div class="call-inner">
      <div class="call-state" id="callState">来电</div>
      <div class="call-avatar" id="callAvatar">林</div>
      <div class="call-name" id="callName">林深</div>
      <div class="call-sub" id="callSub">邀请你进行 FaceTime 通话</div>

      <div class="call-actions" id="callActions">
        <div class="call-btn-wrap">
          <button class="call-btn decline" id="btnDecline">✕</button>
          <span>拒绝</span>
        </div>
        <div class="call-btn-wrap">
          <button class="call-btn accept" id="btnAccept">✆</button>
          <span>接听</span>
        </div>
      </div>

      <div class="call-active hidden" id="callActive">
        <div class="call-timer" id="callTimer">00:00</div>
        <div class="call-lines" id="callLines"></div>
        <div class="call-btn-wrap hangup-wrap">
          <button class="call-btn hangup" id="btnHangup">✕</button>
          <span>挂断</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 图片放大查看器 -->
  <div class="viewer" id="viewer"></div>

  <!-- 提示条 -->
  <div class="toast" id="toast"></div>

</div>

<script src="app.js"></script>
</body>
</html>
