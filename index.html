<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Wonbin Phone</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
  min-height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.iphone {
  width: 375px;
  height: 720px;
  background: #1c1c1e;
  border-radius: 44px;
  padding: 60px 24px 40px;
  position: relative;
  overflow: hidden;
  color: #fff;
}
.status-bar {
  position: absolute;
  top: 28px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}
.time-big {
  font-size: 80px;
  font-weight: 200;
  margin-top: 20px;
  line-height: 1;
}
.date-text {
  font-size: 22px;
  color: #ddd;
  margin:8px 0 30px;
}
.widget {
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 22px;
  padding:18px;
  margin-bottom:16px;
}
.widget-title {
  font-size:14px;
  color:#eee;
  margin-bottom:8px;
}
.birthday {
  font-size:17px;
}
.weather {
  display:flex;
  justify-content: space-between;
  align-items:center;
  font-size:17px;
}
</style>
</head>
<body>
<div class="iphone">
  <div class="status-bar">
    <span id="sb-time">00:00</span>
    <span>●●●</span>
  </div>
  <div id="main-time" class="time-big">00:00</div>
  <div id="date" class="date-text">월요일 1월 1일</div>

  <div class="widget">
    <div class="widget-title">🎂 생일 카운트다운</div>
    <div id="birthday-text" class="birthday">계산중...</div>
  </div>

  <div class="widget">
    <div class="widget-title">🌤 서울 날씨</div>
    <div class="weather">
      <span>맑음</span>
      <span>20°</span>
    </div>
  </div>
</div>

<script>
// 👉 여기 생일 날짜 바꿔주세요! 연,월,일
const BIRTHDAY = new Date("2008-08-31");

function updateClock(){
  const now = new Date();
  // 한국 시간 표시
  const timeStr = now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', hour12:false});
  const dateStr = now.toLocaleDateString('ko-KR', {weekday:'long', month:'long', day:'numeric'});
  
  document.getElementById("main-time").innerText = timeStr;
  document.getElementById("sb-time").innerText = timeStr;
  document.getElementById("date").innerText = dateStr;

  // 생일 카운트다운
  let thisYearBirth = new Date(now.getFullYear(), BIRTHDAY.getMonth(), BIRTHDAY.getDate());
  if(thisYearBirth < now){
    thisYearBirth.setFullYear(now.getFullYear()+1);
  }
  const diff = Math.ceil((thisYearBirth - now) / (1000*60*60*24));
  document.getElementById("birthday-text").innerText = `원빈 생일까지 ${diff}일 남음`;
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
